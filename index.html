<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD39W2eCzb4_16erMmDy0WzpiWL0C05L_A",
  authDomain: "league-race.firebaseapp.com",
  databaseURL: "https://league-race-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "league-race",
  storageBucket: "league-race.firebasestorage.app",
  messagingSenderId: "837960999540",
  appId: "1:837960999540:web:85073d781aaca6b5baa721"
};
const fdb = getDatabase(initializeApp(firebaseConfig));
const DIFFS=[ // objetivo: Easy 20-40s, Normal 40-60s, Hard 50-75s, Extreme 60-90s
  {cw:9,ch:14,loop:.06,spd:6,bias:[1,.4],ramp:60,assist:4},
  {cw:13,ch:19,loop:.04,spd:5.8,bias:[1,.4],ramp:60,assist:4},
  {cw:17,ch:24,loop:.02,spd:7.5,bias:[1,.4],ramp:60,assist:4},
  {cw:23,ch:33,loop:0,spd:13,bias:[1,.4],ramp:40,assist:3}
];
let D=DIFFS[1],CW,CH,W,H,acc=0,gdist;
function applyDiff(){D=DIFFS[+document.getElementById("diff").value];CW=D.cw;CH=D.ch;W=2*CW+1;H=2*CH+1}
const COLORS=[{n:"Red",c:"#ff3b4e"},{n:"Blue",c:"#3b82ff"},{n:"Yellow",c:"#ffd426"},{n:"Green",c:"#2ee66b"}];
const OFF=[[-.17,-.17],[.17,-.17],[-.17,.17],[.17,.17]];
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),msg=document.getElementById("msg"),stage=document.getElementById("stage"),bar=document.querySelector(".bar"),st=document.getElementById("st");
let grid,start,goal,racers=[],state="idle",ts=22,dpr=1,layer,lastT=0,cd=0,ya=0,winner=null,pulse=0,wins=[0,0,0,0];
let mtxt={lines:[],color:"#fff",small:false};
let pickOn=false,lastN=null,knifeOn=false,knife=null;
const pickEl=document.getElementById("pick");
const setPick=on=>{pickOn=on;pickEl.style.display=on?"block":"none"};
const score=document.getElementById("score");
const setStatus=t=>{st.textContent=t};
function setMsg(lines,color,small){mtxt={lines,color:color||"#fff",small:!!small};msg.className=small?"small":"";msg.style.color=mtxt.color;msg.innerHTML=lines.join("<br>")}
function renderScore(){score.innerHTML=COLORS.map((k,i)=>`<div class="chip" style="color:${k.c}"><i style="background:${k.c}"></i><span>${wins[i]}</span></div>`).join("")}

function gen(){
  grid=Array.from({length:H},()=>Array(W).fill(1));
  const s=[[1,1]];grid[1][1]=0;
  while(s.length){
    const[x,y]=s[s.length-1];
    const n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const nx=x+a,ny=y+b;return nx>0&&ny>0&&nx<W-1&&ny<H-1&&grid[ny][nx]});
    if(!n.length){s.pop();continue}
    const[a,b]=n[Math.random()*n.length|0];
    grid[y+b/2][x+a/2]=0;grid[y+b][x+a]=0;s.push([x+a,y+b]);
  }
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(grid[y][x]&&(x+y)%2===1&&Math.random()<D.loop)grid[y][x]=0;
  const cx=1+2*(Math.random()*CW|0),cy=1+2*(Math.random()*CH|0);
  start=[cx,cy];
  const d=Array.from({length:H},()=>Array(W).fill(-1));d[cy][cx]=0;
  const q=[[cx,cy]];let far=[cx,cy];
  for(let i=0;i<q.length;i++){
    const[x,y]=q[i];far=[x,y];
    for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(!grid[ny][nx]&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}
  }
  goal=far;
  // salida = punto más lejano de la meta (recorrido siempre largo y parejo) + mapa de distancias a la meta
  gdist=new Int32Array(W*H).fill(-1);gdist[goal[1]*W+goal[0]]=0;
  const gq=[goal];let last=goal;
  for(let i=0;i<gq.length;i++){
    const[x,y]=gq[i];last=gq[i];
    for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(!grid[ny][nx]&&gdist[ny*W+nx]<0){gdist[ny*W+nx]=gdist[y*W+x]+1;gq.push([nx,ny])}}
  }
  start=last;
  racers=COLORS.map((k,i)=>({k,i,x:start[0],y:start[1],px:start[0],py:start[1],nx:start[0],ny:start[1],t:1,lx:-1,ly:-1,
    bias:D.bias[0]+Math.random()*D.bias[1],spd:.92+Math.random()*.16,trail:[],flash:0,el:0,dead:false,knife:false,v:new Uint16Array(W*H)}));
}

function placeKnife(){
  knife=null;if(!knifeOn||!gdist)return;
  const path=[];let x=start[0],y=start[1];
  while(gdist[y*W+x]>0){
    path.push([x,y]);let best=null;
    for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(!grid[ny][nx]&&gdist[ny*W+nx]===gdist[y*W+x]-1){best=[nx,ny];break}}
    if(!best)break;x=best[0];y=best[1];
  }
  if(path.length<4)return;
  const p=path[Math.max(3,Math.floor(path.length*(.08+Math.random()*.14)))];
  knife={x:p[0],y:p[1],held:null};
}
function drawKnife(c,x,y,s,rot){
  c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);c.translate(-.12,0);
  c.fillStyle="#e9edf7";c.strokeStyle="rgba(0,0,0,.65)";c.lineWidth=.035;
  c.beginPath();c.moveTo(0,-.1);c.lineTo(.42,-.1);c.quadraticCurveTo(.6,-.07,.64,.08);c.lineTo(0,.08);c.closePath();c.fill();c.stroke();
  c.fillStyle="#9aa3bd";c.fillRect(0,.035,.5,.04);
  c.fillStyle="#d4aa4c";c.fillRect(-.07,-.15,.07,.27);
  c.fillStyle="#7a4a2a";c.fillRect(-.38,-.075,.31,.15);c.strokeRect(-.38,-.075,.31,.15);
  c.restore();
}

function makeLayer(sc){
  const c=document.createElement("canvas");c.width=Math.round(W*sc);c.height=Math.round(H*sc);
  const l=c.getContext("2d");l.scale(c.width/W,c.height/H);
  l.fillStyle="#171a26";l.fillRect(0,0,W,H);l.fillStyle="#394160";
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])l.fillRect(x,y,1.02,1.02);
  return c;
}
function fit(){
  const b=document.body,cs=getComputedStyle(b),rec=b.classList.contains("rec");
  const availW=b.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  let availH=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!rec)availH-=bar.offsetHeight+10;
  const w=Math.floor(Math.max(180,Math.min(availW,availH*9/16,540)));
  stage.style.width=w+"px";stage.style.height=w*16/9+"px";stage.style.setProperty("--u",w/100+"px");
  size();
}
function size(){
  const w=cv.parentElement.clientWidth;dpr=devicePixelRatio||1;
  ts=w/W;cv.width=Math.round(w*dpr);cv.height=Math.round(ts*H*dpr);cv.style.height=ts*H+"px";
  layer=makeLayer(ts*dpr);
}

function pick(r){
  const opts=[];
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=r.x+a,ny=r.y+b;if(grid[ny][nx])continue;
    const back=nx===r.lx&&ny===r.ly;
    const closer=Math.abs(nx-goal[0])+Math.abs(ny-goal[1])<Math.abs(r.x-goal[0])+Math.abs(r.y-goal[1]);
    let w=(closer?r.bias:1)*(back?.02:1)/(1+1.5*r.v[ny*W+nx]);
    if(gdist[ny*W+nx]<gdist[r.y*W+r.x])w*=1+(r.el/D.ramp)**2*D.assist;
    opts.push({nx,ny,back,w});
  }
  const nb=opts.filter(o=>!o.back),list=nb.length?nb:opts;
  // choque: hay pared justo delante de la bola (esquina, giro o callejón sin salida)
  const wall=r.lx>=0&&grid[r.y+(r.y-r.ly)][r.x+(r.x-r.lx)]===1;
  if(!nb.length)r.flash=1;
  if(wall||!nb.length)collide(r);
  let s=list.reduce((a,o)=>a+o.w,0),p=Math.random()*s;
  for(const o of list){p-=o.w;if(p<=0)return o}
  return list[0];
}

function play(){
  if(cur)stopRec(false);
  applyDiff();gen();placeKnife();size();winner=null;state="count";cd=3.99;ya=0;lastN=null;setMsg([]);setPick(false);
  racers.forEach(r=>{const o=pick(r);r.nx=o.nx;r.ny=o.ny;r.t=0});
  acc=0;initAudio();if(actx)actx.resume();musicStart();
  if(recOn)startRec();
}

function step(dt){
  const sp=+document.getElementById("speed").value*D.spd;
  for(const r of racers){
    if(r.dead){r.flash=Math.max(0,r.flash-dt*4);if(r.trail.length)r.trail.shift();continue}
    r.t+=sp*r.spd*dt;
    while(r.t>=1&&!winner){
      r.t-=1;r.lx=r.x;r.ly=r.y;r.x=r.nx;r.y=r.ny;r.v[r.y*W+r.x]++;
      if(r.x===goal[0]&&r.y===goal[1]){winner=r;r.t=0;r.nx=r.x;r.ny=r.y;break}
      const o=pick(r);r.nx=o.nx;r.ny=o.ny;
    }
    if(winner===r){r.px=r.x;r.py=r.y}
    else{r.px=r.x+(r.nx-r.x)*Math.min(r.t,1);r.py=r.y+(r.ny-r.y)*Math.min(r.t,1)}
    r.flash=Math.max(0,r.flash-dt*4);r.el+=dt;
    const x=r.px+.5+OFF[r.i][0],y=r.py+.5+OFF[r.i][1];
    r.trail.push([x,y]);if(r.trail.length>45)r.trail.shift();
  }
  if(knife&&!knife.held){
    for(const r of racers){
      if(!r.dead&&Math.hypot(r.px-knife.x,r.py-knife.y)<.5){knife.held=r;r.knife=true;r.flash=1;knifeSfx("pick");break}
    }
  }else if(knife&&knife.held){
    const h=knife.held;let hit=null,bd=.55;
    for(const o of racers){
      if(o===h||o.dead)continue;
      const d=Math.hypot(h.px-o.px,h.py-o.py);
      if(d<bd){bd=d;hit=o}
    }
    if(hit){hit.dead=true;hit.flash=1;h.knife=false;h.flash=1;knife=null;knifeSfx("kill")}
  }
}

function drawScene(c,lay,sc){
  c.save();
  c.drawImage(lay,0,0,W*sc,H*sc);
  c.scale(sc,sc);
  const g=.35+.1*Math.sin(pulse),s0=(g+.2)*2,gx=goal[0]+.5-g-.2,gy=goal[1]+.5-g-.2;
  c.fillStyle="#fff";c.fillRect(gx,gy,s0,s0);c.fillStyle="#111";
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)if((i+j)%2===0)c.fillRect(gx+i*s0/4,gy+j*s0/4,s0/4,s0/4);
  c.strokeStyle="#fff";c.globalAlpha=.3;c.lineWidth=.06;c.strokeRect(start[0]+.1,start[1]+.1,.8,.8);c.globalAlpha=1;
  if(knife&&!knife.held){
    const kx=knife.x+.5,ky=knife.y+.5+.05*Math.sin(pulse*1.5);
    const kg=c.createRadialGradient(kx,ky,0,kx,ky,.95);kg.addColorStop(0,"rgba(255,255,255,.55)");kg.addColorStop(1,"rgba(255,255,255,0)");
    c.fillStyle=kg;c.fillRect(kx-1,ky-1,2,2);
    drawKnife(c,kx,ky,1.15,-Math.PI/4+.12*Math.sin(pulse));
  }
  for(const r of racers){
    const x=r.px+.5+OFF[r.i][0],y=r.py+.5+OFF[r.i][1],T=r.trail;
    c.lineCap="round";c.lineJoin="round";
    for(let i=1;i<T.length;i++){
      const a=i/T.length;c.strokeStyle=r.k.c;c.globalAlpha=a*.6;c.lineWidth=.1+.22*a;
      c.beginPath();c.moveTo(T[i-1][0],T[i-1][1]);c.lineTo(T[i][0],T[i][1]);c.stroke();
    }
    c.globalAlpha=1;
    if(r.dead){
      c.globalAlpha=.4;c.fillStyle=r.k.c;c.fillRect(x-.17,y-.17,.34,.34);c.globalAlpha=1;
      c.strokeStyle="#fff";c.lineWidth=.07;c.beginPath();c.moveTo(x-.2,y-.2);c.lineTo(x+.2,y+.2);c.moveTo(x+.2,y-.2);c.lineTo(x-.2,y+.2);c.stroke();
      continue;
    }
    const s=.34+r.flash*.12;
    const gl=c.createRadialGradient(x,y,0,x,y,.75);gl.addColorStop(0,r.k.c+"aa");gl.addColorStop(1,r.k.c+"00");
    c.fillStyle=gl;c.fillRect(x-.75,y-.75,1.5,1.5);
    c.fillStyle=r.k.c;c.fillRect(x-s/2,y-s/2,s,s);
    c.strokeStyle="rgba(255,255,255,.8)";c.lineWidth=.04;c.strokeRect(x-s/2,y-s/2,s,s);
    if(r.knife)drawKnife(c,x+.24,y-.24,.8,-Math.PI/4);
  }
  c.restore();
}

/* ---------- Grabación y exportación ---------- */
let recOn=false,cur=null,lastBlob=null,lastName="";
const expBtn=document.getElementById("exp"),dlBtn=document.getElementById("dl"),qSel=document.getElementById("q");
let mp4=null;
const MUXER_URL="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs";
const BR=pw=>pw>=2160?25e6:12e6;
async function detectMp4(){
  try{
    if(!(window.VideoEncoder&&window.AudioEncoder&&window.VideoFrame&&window.AudioData&&window.OfflineAudioContext))return;
    const M=await import(MUXER_URL),vc={};
    for(const pw of[1080,2160]){
      const ph=pw*16/9,fps=pw>=2160?30:60;
      for(const codec of(pw>=2160?["avc1.640033","avc1.4d0033","avc1.640032"]:["avc1.64002a","avc1.4d002a","avc1.640028"])){
        const r=await VideoEncoder.isConfigSupported({codec,width:pw,height:ph,bitrate:BR(pw),framerate:fps});
        if(r&&r.supported){vc[pw]=codec;break}
      }
    }
    const a=await AudioEncoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:48000,numberOfChannels:2,bitrate:192000});
    if(a&&a.supported&&(vc[1080]||vc[2160]))mp4={M,vc};
  }catch(e){mp4=null}
  setStatus(mp4?"MP4 export ready (H.264 + AAC)":"This browser will record with its built-in recorder (MP4 or WebM)");
}
function startWC(pw,ph){
  const fps=pw>=2160?30:60,u=pw/100,mw=Math.min(94*u,(ph-41.5*u)*W/H),sc=mw/W;
  const cvs=document.createElement("canvas");cvs.width=pw;cvs.height=ph;
  const muxer=new mp4.M.Muxer({target:new mp4.M.ArrayBufferTarget(),video:{codec:"avc",width:pw,height:ph},audio:{codec:"aac",numberOfChannels:2,sampleRate:48000},fastStart:"in-memory",firstTimestampBehavior:"offset"});
  const c={wc:true,muxer,fps,last:0,t0:null,lastT:0,n:0,sfx:[],winT:null,musicT0:musicOn?musicT0:null,cancelled:false,failed:null,cvs,rc:cvs.getContext("2d"),u,sc,lay:makeLayer(sc),pw,ph,mw};
  c.venc=new VideoEncoder({output:(ch,meta)=>{try{muxer.addVideoChunk(ch,meta)}catch(e){c.failed=e}},error:e=>{c.failed=e}});
  c.venc.configure({codec:mp4.vc[pw],width:pw,height:ph,bitrate:BR(pw),framerate:fps});
  cur=c;setStatus("● Recording MP4 at "+pw+"×"+ph+"…");
}
function wcPush(c,t){
  if(c.failed){stopRec(false);setStatus("Recording stopped: "+(c.failed.message||"encoder error")+". Try Full HD.");return}
  if(c.t0===null)c.t0=t;
  if(c.venc.encodeQueueSize>8)return;
  const f=new VideoFrame(c.cvs,{timestamp:Math.round((t-c.t0)*1000),duration:Math.round(1e6/c.fps)});
  c.venc.encode(f,{keyFrame:c.n%(c.fps*2)===0});f.close();c.n++;c.lastT=t;
}
async function finishWC(c){
  try{
    setStatus("Finishing MP4 (audio + encoding)…");
    await c.venc.flush();
    const dur=Math.max(.5,(c.lastT-c.t0)/1000+.05),SR=48000,off=new OfflineAudioContext(2,Math.ceil(dur*SR),SR);
    const master=off.createGain();master.connect(off.destination);
    if(c.musicT0!==null){
      try{
        const ab=await(await fetch("musica_carrera_100_loop.mp3")).arrayBuffer(),buf=await off.decodeAudioData(ab);
        const src=off.createBufferSource(),mg=off.createGain();src.buffer=buf;src.loop=true;src.connect(mg);mg.connect(master);
        const o=Math.max(0,(c.t0-c.musicT0)/1000)%buf.duration;src.start(0,o);
        if(c.winT!==null){const tw=Math.max(0,(c.winT-c.t0)/1000);mg.gain.setValueAtTime(1,tw);mg.gain.linearRampToValueAtTime(0,tw+2.2)}
      }catch(e){console.warn("music not added",e)}
    }
    const sg=off.createGain();sg.gain.value=.5;sg.connect(master);
    const bg=off.createGain();bg.gain.value=.55;bg.connect(master);
    for(const e of c.sfx){
      const w=(e.t-c.t0)/1000;if(w<-.05||w>=dur)continue;const ww=Math.max(0,w);
      if(e.k==="beep")playBeep(off,bg,ww,e.go);
      else if(e.k==="pick"||e.k==="kill")playKnife(off,sg,ww,e.k);
      else playSfx(off,sg,ww,e.i,e.n);
    }
    const out=await off.startRendering(),L=out.getChannelData(0),Rr=out.getChannelData(1);
    const aenc=new AudioEncoder({output:(ch,meta)=>c.muxer.addAudioChunk(ch,meta),error:e=>{c.failed=e}});
    aenc.configure({codec:"mp4a.40.2",sampleRate:SR,numberOfChannels:2,bitrate:192000});
    const CH=SR;
    for(let i=0;i<L.length;i+=CH){
      const n=Math.min(CH,L.length-i),d=new Float32Array(n*2);d.set(L.subarray(i,i+n),0);d.set(Rr.subarray(i,i+n),n);
      const ad=new AudioData({format:"f32-planar",sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/SR*1e6),data:d});
      aenc.encode(ad);ad.close();
    }
    await aenc.flush();aenc.close();c.venc.close();
    if(c.failed)throw c.failed;
    c.muxer.finalize();
    lastBlob=new Blob([c.muxer.target.buffer],{type:"video/mp4"});
    lastName="maze-race-"+c.pw+"p-"+Date.now()+".mp4";
    dlBtn.hidden=false;saveLast();
  }catch(e){console.error(e);setStatus("MP4 export failed: "+(e&&e.message||"error")+". Try Full HD or another browser.")}
}
function startRec(){
  const pw0=+qSel.value;
  if(mp4&&mp4.vc[pw0]){try{startWC(pw0,pw0*16/9)}catch(e){cur=null;setStatus("Could not record: "+e.message)}return}
  try{
    if(!window.MediaRecorder)throw new Error("this browser does not support MediaRecorder");
    const pw=+qSel.value,ph=pw*16/9,cvs=document.createElement("canvas");cvs.width=pw;cvs.height=ph;
    const u=pw/100,mw=Math.min(94*u,(ph-41.5*u)*W/H),sc=mw/W;
    const mimes=["video/mp4;codecs=avc1,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
    const mt=mimes.find(m=>MediaRecorder.isTypeSupported(m))||"";
    const fps=pw>=2160?30:60;
    let stream=cvs.captureStream(0),manual=!!(stream.getVideoTracks()[0]&&stream.getVideoTracks()[0].requestFrame);
    if(!manual)stream=cvs.captureStream(fps);
    if(recDest)recDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    const mr=new MediaRecorder(stream,{mimeType:mt||undefined,videoBitsPerSecond:pw>=2160?30e6:16e6,audioBitsPerSecond:192000});
    const c={mr,mt,fps,manual,track:stream.getVideoTracks()[0],last:0,chunks:[],cancelled:false,cvs,rc:cvs.getContext("2d"),u,sc,lay:makeLayer(sc),pw,ph,mw};
    mr.ondataavailable=e=>{if(e.data&&e.data.size)c.chunks.push(e.data)};
    mr.onstop=()=>finishRec(c);
    mr.onerror=e=>setStatus("Recording error: "+(e.error&&e.error.message||"unknown"));
    mr.start(1000);cur=c;setStatus("● Recording at "+pw+"×"+Math.round(ph)+"…");
  }catch(err){cur=null;setStatus("Could not record: "+err.message)}
}
function stopRec(save){
  const c=cur;if(!c)return;cur=null;c.cancelled=!save;
  if(c.wc){
    if(save&&c.n>0)finishWC(c);
    else{try{c.venc.close()}catch(e){}setStatus("")}
    return;
  }
  if(c.mr.state!=="inactive")c.mr.stop();
  if(!save)setStatus("");
}
async function finishRec(c){
  if(c.cancelled||!c.chunks.length)return;
  lastBlob=new Blob(c.chunks,{type:c.mt||"video/webm"});
  lastName="maze-race-"+c.pw+"p-"+Date.now()+"."+(c.mt.startsWith("video/mp4")?"mp4":"webm");
  dlBtn.hidden=false;await saveLast();
}
function saveLast(){
  if(!lastBlob)return;
  const u=URL.createObjectURL(lastBlob),l=document.createElement("a");
  l.href=u;l.download=lastName;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);setStatus("✔ Video exported: "+lastName);
}
function recFrame(c){
  const{rc,u,pw,ph}=c;
  rc.setTransform(1,0,0,1,0,0);
  const gr=rc.createRadialGradient(pw/2,0,0,pw/2,0,ph*.8);
  gr.addColorStop(0,"#232a45");gr.addColorStop(.6,"#10121b");gr.addColorStop(1,"#0a0b11");
  rc.fillStyle=gr;rc.fillRect(0,0,pw,ph);
  rc.textAlign="center";rc.textBaseline="top";rc.fillStyle="#ececf1";
  rc.font="900 "+6.6*u+"px system-ui,sans-serif";
  rc.fillText("WHO WILL REACH",pw/2,5*u);rc.fillText("100 FIRST?",pw/2,5*u+6.9*u);
  rc.globalAlpha=.6;rc.font="600 "+3.2*u+"px system-ui,sans-serif";
  if("letterSpacing"in rc)rc.letterSpacing=.4*u+"px";
  rc.fillText("RED · BLUE · YELLOW · GREEN",pw/2,5*u+15.2*u);
  if("letterSpacing"in rc)rc.letterSpacing="0px";
  rc.globalAlpha=1;
  const mw=c.mw,mx=(pw-mw)/2,my=27*u,mh=mw*H/W;
  rc.save();rc.translate(mx,my);
  rc.beginPath();if(rc.roundRect)rc.roundRect(0,0,mw,mh,2*u);else rc.rect(0,0,mw,mh);rc.clip();
  drawScene(rc,c.lay,c.sc);
  if(mtxt.lines.length){
    const fs=(mtxt.small?10:14)*u;rc.font="900 "+fs+"px system-ui,sans-serif";rc.textBaseline="middle";
    rc.shadowColor="rgba(0,0,0,.7)";rc.shadowBlur=1.5*u;rc.shadowOffsetY=.6*u;rc.fillStyle=mtxt.color;
    const n=mtxt.lines.length;
    mtxt.lines.forEach((t,i)=>rc.fillText(t,mw/2,mh/2+(i-(n-1)/2)*fs*1.05));
  }
  if(pickOn){
    rc.textAlign="center";rc.textBaseline="middle";rc.font="900 "+7.2*u+"px system-ui,sans-serif";
    if("letterSpacing"in rc)rc.letterSpacing=.3*u+"px";
    rc.shadowColor="rgba(0,0,0,.7)";rc.shadowBlur=1.5*u;rc.shadowOffsetY=.6*u;rc.fillStyle="#fff";
    rc.fillText("PICK YOUR COLOR!",mw/2,mh/2-13*u);
    if("letterSpacing"in rc)rc.letterSpacing="0px";
  }
  rc.restore();
  rc.textAlign="left";
  rc.textBaseline="middle";rc.font="800 "+6*u+"px system-ui,sans-serif";rc.textAlign="left";
  const chip=COLORS.map((k,i)=>{const t=String(wins[i]);return{k,t,w:5*u+1.6*u+rc.measureText(t).width}});
  const tot=chip.reduce((a,o)=>a+o.w,0)+3*u*3;let x=(pw-tot)/2;const cy=my+mh+8*u;
  for(const o of chip){
    rc.fillStyle=o.k.c;rc.fillRect(x,cy-2.5*u,5*u,5*u);
    rc.fillText(o.t,x+6.6*u,cy+.2*u);x+=o.w+3*u;
  }
}

function loop(t){
  requestAnimationFrame(loop); // primero: así un error puntual nunca congela el juego
  try{
    const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;pulse+=dt*4;
    if(state==="count"){
      cd-=dt;const n=Math.max(0,Math.ceil(cd));setMsg([n>0?String(n):"GO!"]);setPick(n>0);
      if(n!==lastN){lastN=n;countBeep(n)}
      if(cd<=0){state="run";ya=.6}
    }
    if(state==="run"){
      if(ya>0){ya-=dt;if(ya<=0)setMsg([])}
      acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60;if(winner)break}
      if(winner){
        state="done";musicFade();addWin(winner.i);setMsg([winner.k.n.toUpperCase(),"WINS!"],winner.k.c,true);
        const c=cur;if(c)c.winT=t;if(c)setTimeout(()=>{if(cur===c)stopRec(true)},2500);
      }
    }
    const doRec=cur&&(t-cur.last>=1000/cur.fps-3);
    if(!cur||doRec){ctx.setTransform(1,0,0,1,0,0);drawScene(ctx,layer,ts*dpr)}
    if(doRec){
      cur.last=t;
      try{recFrame(cur);if(cur.wc)wcPush(cur,t);else if(cur.manual)cur.track.requestFrame()}
      catch(e){stopRec(false);setStatus("Recording stopped: "+(e&&e.message||"error")+". Try Full HD.")}
    }
  }catch(e){console.error(e)}
}
/* ---------- Marcador persistente (Realtime Database) ---------- */
const dbRef=ref(fdb,"stats/wins");
const err=e=>setStatus("Could not save the scoreboard ("+(e&&e.code||"error")+")");
const saveWins=()=>set(dbRef,{w0:wins[0],w1:wins[1],w2:wins[2],w3:wins[3]}).catch(err);
function addWin(i){
  wins[i]++;renderScore();
  runTransaction(dbRef,cur=>{cur=cur||{};for(let k=0;k<4;k++)cur["w"+k]=+cur["w"+k]||0;cur["w"+i]++;return cur}).catch(err);
}
function initDb(){
  onValue(dbRef,snap=>{
    const d=snap.val();
    if(d){wins=[0,1,2,3].map(i=>+d["w"+i]||0);renderScore()}
  },e=>setStatus("Scoreboard is not syncing ("+(e&&e.code||"error")+")"));
}
let armed=false;
document.getElementById("rs").onclick=function(){
  if(!armed){armed=true;this.textContent="Sure? Tap again";setTimeout(()=>{armed=false;this.textContent="↺ Reset scoreboard"},3000);return}
  armed=false;this.textContent="↺ Reset scoreboard";wins=[0,0,0,0];renderScore();saveWins();
};
/* ---------- Música ---------- */
const music=new Audio("musica_carrera_100_loop.mp3");music.loop=true;music.preload="auto";
let actx=null,gain=null,sfxGain=null,beepGain=null,recDest=null,musicOn=true,sfxOn=true,musicT0=0;
function initAudio(){
  if(actx)return;
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(music);
    gain=actx.createGain();sfxGain=actx.createGain();sfxGain.gain.value=.5;beepGain=actx.createGain();beepGain.gain.value=.55;recDest=actx.createMediaStreamDestination();
    src.connect(gain);
    [gain,sfxGain,beepGain].forEach(n=>{n.connect(actx.destination);n.connect(recDest)});
  }catch(e){actx=null;recDest=null}
}
function musicStart(){
  if(!musicOn)return;
  initAudio();
  if(actx){actx.resume();gain.gain.cancelScheduledValues(actx.currentTime);gain.gain.setValueAtTime(1,actx.currentTime)}
  music.currentTime=0;musicT0=performance.now();music.play().catch(()=>setStatus("Tap the screen to enable music"));
}
function musicFade(){
  if(!actx||music.paused)return;
  const t=actx.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(gain.gain.value,t);gain.gain.linearRampToValueAtTime(0,t+2.2);
  setTimeout(()=>{if(state==="done")music.pause()},2400);
}
/* ---------- Sonido de choque: uno distinto por cada bola ---------- */
const SFX=[
  {type:"square",f:196,m:[1,1.25,1.5,2],drop:.6,dur:.2,lp:1200},     // Red: golpe grave
  {type:"sine",f:440,m:[1,1.2,1.5,1.8],drop:.45,dur:.25},            // Blue: bloop
  {type:"triangle",f:784,m:[1,1.12,1.5,2],drop:1.5,dur:.18},         // Yellow: chirrido agudo
  {type:"sawtooth",f:330,m:[1,1.33,1.5,2],drop:.7,dur:.22,lp:1800}   // Green: zumbido
];
function playSfx(c,dest,when,i,n){
  const p=SFX[i],o=c.createOscillator(),g=c.createGain(),f=p.f*p.m[n];
  o.type=p.type;o.frequency.setValueAtTime(f,when);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*p.drop),when+p.dur);
  g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.45,when+.008);g.gain.exponentialRampToValueAtTime(.0001,when+p.dur);
  let last=o;
  if(p.lp){const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=p.lp;o.connect(lp);last=lp}
  last.connect(g);g.connect(dest);o.start(when);o.stop(when+p.dur+.02);
}
/* ---------- Pitidos de salida (4·3·2·1·GO): suenan SIEMPRE, con o sin música/SFX ---------- */
function playBeep(c,dest,when,go){
  const f=go?1320:660,dur=go?.85:.3;
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.7,when+.006);
  g.gain.setValueAtTime(.7,when+dur-.04);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  [["square",f,.5],["sine",f*2,.25]].forEach(([type,fr,v])=>{
    const o=c.createOscillator(),og=c.createGain();o.type=type;o.frequency.value=fr;og.gain.value=v;
    o.connect(og);og.connect(lp);o.start(when);o.stop(when+dur+.02);
  });
  lp.connect(g);g.connect(dest);
}
function countBeep(n){
  const go=n<=0;
  if(actx&&beepGain){actx.resume();playBeep(actx,beepGain,actx.currentTime,go)}
  if(cur&&cur.wc)cur.sfx.push({t:performance.now(),k:"beep",go});
}
/* ---------- Sonidos del cuchillo ---------- */
function playKnife(c,dest,when,kind){
  const tone=(type,f0,f1,d,v,t0,lpf)=>{
    const o=c.createOscillator(),g=c.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,when+t0);o.frequency.exponentialRampToValueAtTime(f1,when+t0+d);
    g.gain.setValueAtTime(.0001,when+t0);g.gain.exponentialRampToValueAtTime(v,when+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,when+t0+d);
    let last=o;if(lpf){const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=lpf;o.connect(lp);last=lp}
    last.connect(g);g.connect(dest);o.start(when+t0);o.stop(when+t0+d+.02);
  };
  if(kind==="pick"){tone("triangle",1400,2800,.2,.3,0);tone("triangle",2100,4200,.22,.25,.05)}
  else{tone("sawtooth",300,50,.38,.6,0,900);tone("triangle",1800,300,.14,.35,0)}
}
function knifeSfx(kind){
  if(!sfxOn)return;
  if(actx&&sfxGain)playKnife(actx,sfxGain,actx.currentTime,kind);
  if(cur&&cur.wc)cur.sfx.push({t:performance.now(),k:kind});
}
function collide(r){
  if(state!=="run"||!sfxOn)return;
  const now=performance.now();
  if(now-(r.lastSfx||0)<120)return;r.lastSfx=now;
  const n=Math.random()*4|0;
  if(actx&&sfxGain)playSfx(actx,sfxGain,actx.currentTime,r.i,n);
  if(cur&&cur.wc)cur.sfx.push({t:now,i:r.i,n});
}
document.getElementById("kn").onclick=function(){
  knifeOn=!knifeOn;this.textContent="🔪 Knife: "+(knifeOn?"ON":"OFF");this.classList.toggle("on",knifeOn);
  if(state!=="run"&&state!=="count")placeKnife();
  setStatus(knifeOn?"A knife will appear on the route. Grab it and the first color you bump into is out.":"");
};
document.getElementById("sf").onclick=function(){sfxOn=!sfxOn;this.textContent="🔔 SFX: "+(sfxOn?"ON":"OFF")};
document.getElementById("mu").onclick=function(){
  musicOn=!musicOn;this.textContent="🔊 Music: "+(musicOn?"ON":"OFF");
  if(!musicOn)music.pause();
};
document.getElementById("play").onclick=play;
document.getElementById("rec").onclick=()=>{document.body.classList.add("rec");fit();try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:"hide"});if(r&&r.catch)r.catch(()=>{})}catch(e){}setTimeout(fit,350)};
expBtn.onclick=()=>{recOn=!recOn;expBtn.textContent="⏺ Export video: "+(recOn?"YES":"NO");expBtn.classList.toggle("on",recOn);setStatus(recOn?"Each race will be recorded from the countdown to the finish and exported when it ends.":"")};
dlBtn.onclick=saveLast;
let lp=null,lpFired=false;
stage.addEventListener("pointerdown",()=>{lpFired=false;lp=setTimeout(()=>{if(document.body.classList.contains("rec")){lpFired=true;document.body.classList.remove("rec");if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});fit()}},900)});
["pointerup","pointerleave","pointercancel"].forEach(ev=>stage.addEventListener(ev,()=>clearTimeout(lp)));
stage.addEventListener("click",()=>{if(document.body.classList.contains("rec")&&!lpFired)play()});
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();play()}});
addEventListener("resize",fit);if(window.visualViewport)visualViewport.addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,300));document.addEventListener("fullscreenchange",()=>setTimeout(fit,100));
document.getElementById("diff").onchange=()=>{music.pause();stopRec(false);applyDiff();gen();placeKnife();winner=null;state="idle";setMsg([]);setPick(false);fit()};
applyDiff();gen();placeKnife();renderScore();fit();requestAnimationFrame(loop);initDb();detectMp4();
</script>
